// Создаём полоску уровней и коллекции.
const levelBar = document.createElement('div');

document.querySelector('.adventure').append(levelBar);

// Дополнительное оформление коллекции.

extraStyle.textContent = `

document.head.append(extraStyle);

let level = 0;
let examples = [];
let answers = [];
let selected = 0;
let phase = 'playing';
let checked = false;
let timers = [];

const randomInt = (min, max) => {
  return Math.floor(Math.random() * (max - min + 1)) + min;
};

// Генерация пяти разных примеров.
function makeExamples() {
  const pool = [];

  // Вычисления в пределах 10.
  // Ответы — от 0 до 9, чтобы в окошке была одна цифра.
  for (let a = 0; a <= 10; a++) {
    for (let b = 1; b <= 9; b++) {
      if (a + b <= 9) {
        pool.push({
          a,
          b,
          sign: '+',
          result: a + b
        });
      }

      if (a >= b && a - b <= 9) {
        pool.push({
          a,
          b,
          sign: '−',
          result: a - b
        });
      }
    }
  }

  function take(sign) {
    const indices = pool
      .map((example, index) => {
        return example.sign === sign ? index : -1;
      })
      .filter(index => index >= 0);

    const chosenIndex = indices[
      randomInt(0, indices.length - 1)
    ];

    return pool.splice(chosenIndex, 1)[0];
  }

  // Обязательно один пример на сложение и один на вычитание.
  const set = [
    take('+'),
    take('−')
  ];

  while (set.length < 5) {
    const index = randomInt(0, pool.length - 1);
    set.push(pool.splice(index, 1)[0]);
  }

  // Перемешивание.
  for (let i = set.length - 1; i > 0; i--) {
    const j = randomInt(0, i);
    [set[i], set[j]] = [set[j], set[i]];
  }

  return set;
}

function equation(example) {
  return `${example.a} ${example.sign} ${example.b}`;
}

function setStatus(message, kind = '') {
  $('status').textContent = message;
  $('status').className = `status ${kind}`;
}

function later(action, delay) {
  timers.push(setTimeout(action, delay));
}

// Показываем собранные подарки.
// Будущие подарки скрыты вопросительными знаками.
function renderCollection() {
  levelBar.replaceChildren();

  gifts.forEach((gift, index) => {
    const found =
      index < level ||
      (index === level && phase === 'won');

    const item = document.createElement('div');

    item.className =
      'level-gift' +
      (found
        ? ' found'
        : index === level
          ? ' current'
          : '');

    item.setAttribute(
      'aria-label',
      `Уровень ${index + 1}: ` +
      (found
        ? `${gift.name}, найдено`
        : 'подарок пока скрыт')
    );

    if (index === level) {
      item.setAttribute('aria-current', 'step');
    }

    item.innerHTML = found
      ? `
        <svg viewBox="0 0 90 120" aria-hidden="true">
          ${gift.art}
        </svg>
        <span>Уровень ${index + 1} ✓</span>
      `
      : `
        <span class="mystery" aria-hidden="true">?</span>
        <span>Уровень ${index + 1}</span>
      `;

    levelBar.append(item);
  });
}

// Начало текущего уровня.
function startLevel() {
  timers.forEach(clearTimeout);
  timers = [];

  examples = makeExamples();
  answers = Array(5).fill(null);
  selected = 0;
  phase = 'playing';
  checked = false;

  // Возвращаем сундук и героя в исходное положение.
  scene.className = 'scene';
  void scene.offsetWidth;

  $('confetti').replaceChildren();

  $('speech').textContent = level === 0
    ? 'Поможешь собрать пять подарков?'
    : 'Что же спрятано в этом сундуке?';

  $('new-game').textContent = 'Начать заново ↻';
  $('new-game').disabled = false;

  document.querySelector('.subtitle').textContent =
    `Уровень ${level + 1} из ${gifts.length} · ` +
    'Реши пять примеров и открой сундук!';

  document.querySelector('.badge').textContent =
    `Найдено подарков: ${level} из ${gifts.length}`;

  // Подарок внутри сундука.
  giftInChest.innerHTML = gifts[level].art;

  // Такой же подарок в лапках кролика.
  giftInPaws.innerHTML = `
    <g transform="translate(91 177) scale(.4)">
      ${gifts[level].art}
    </g>
  `;

  code.replaceChildren();
  tasks.replaceChildren();

  examples.forEach((example, index) => {
    // Окошко на сундуке.
    const slot = document.createElement('button');

    slot.type = 'button';
    slot.className = 'slot';

    slot.innerHTML = `
      <span class="value">·</span>
      <span class="slot-number" aria-hidden="true">
        ${index + 1}
      </span>
    `;

    slot.addEventListener('click', () => {
      select(index);
    });

    code.append(slot);

    // Карточка примера.
    const task = document.createElement('button');

    task.type = 'button';
    task.className = 'task';

    task.innerHTML = `
      <span class="label">Цифра ${index + 1}</span>
      <span class="equation">${equation(example)}</span>
    `;

    task.setAttribute(
      'aria-label',
      `Пример ${index + 1}: ${equation(example)}. ` +
      'Выбрать ответ'
    );

    task.addEventListener('click', () => {
      select(index);
    });

    tasks.append(task);
  });

  setStatus('Введи пять цифр, чтобы проверить код.');

  renderCollection();
  render();
}

// Полный перезапуск с первого уровня.
function restartGame() {
  level = 0;
  startLevel();
}

function select(index) {
  if (phase !== 'playing') return;

  selected = index;
  render();
}

// Обновление игрового интерфейса.
function render() {
  const playing = phase === 'playing';

  examples.forEach((example, index) => {
    const slot = code.children[index];
    const task = tasks.children[index];

    const filled = answers[index] !== null;
    const active = playing && selected === index;

    const correct =
      checked &&
      filled &&
      answers[index] === example.result;

    const wrong =
      checked &&
      filled &&
      answers[index] !== example.result;

    slot.querySelector('.value').textContent =
      filled ? answers[index] : '·';

    for (const element of [slot, task]) {
      element.classList.toggle('active', active);
      element.classList.toggle('correct', correct);
      element.classList.toggle('wrong', wrong);

      element.setAttribute(
        'aria-pressed',
        String(active)
      );

      element.disabled = !playing;
    }

    task.classList.toggle('filled', filled);

    slot.setAttribute(
      'aria-label',
      `Цифра ${index + 1}: ` +
      `${filled ? answers[index] : 'пусто'}` +
      `${wrong ? ', проверь ответ' : ''}`
    );
  });

  $('current-label').textContent = playing
    ? `Цифра ${selected + 1} из 5`
    : 'Код разгадан!';

  $('current-equation').textContent = playing
    ? `${equation(examples[selected])} = ?`
    : answers.join(' ');

  const button = $('check');

  if (playing) {
    button.textContent = 'Открыть сундук';

    button.disabled = answers.some(
      answer => answer === null
    );
  } else if (phase === 'opening') {
    button.textContent = 'Кролик забирает подарок…';
    button.disabled = true;
  } else {
    button.textContent = level < gifts.length - 1
      ? 'Следующий уровень →'
      : 'Играть сначала ↻';

    button.disabled = false;
  }

  for (const key of keypad.children) {
    key.disabled = !playing;
  }
}

// Ввод ответа.
function enterDigit(digit) {
  if (
    phase !== 'playing' ||
    !Number.isInteger(digit) ||
    digit < 0 ||
    digit > 9
  ) {
    return;
  }

  answers[selected] = digit;
  checked = false;

  const next = Array.from(
    { length: 5 },
    (_, offset) => (selected + offset + 1) % 5
  ).find(index => answers[index] === null);

  if (next !== undefined) {
    selected = next;
  }

  const allFilled = answers.every(
    answer => answer !== null
  );

  setStatus(
    allFilled
      ? 'Код готов! Нажми «Открыть сундук».'
      : 'Продолжай! Реши следующий пример.'
  );

  render();
}

// Стереть выбранную цифру.
function eraseDigit() {
  if (phase !== 'playing') return;

  answers[selected] = null;
  checked = false;

  setStatus(
    `Введи новый ответ для цифры ${selected + 1}.`
  );

  render();
}

// Проверка всех пяти ответов.
function checkCode() {
  if (
    phase !== 'playing' ||
    answers.some(answer => answer === null)
  ) {
    return;
  }

  checked = true;

  const wrong = examples
    .map((example, index) => {
      return answers[index] !== example.result
        ? index
        : -1;
    })
    .filter(index => index >= 0);

  if (wrong.length) {
    selected = wrong[0];

    $('speech').textContent =
      'Почти! Проверим ещё раз?';

    const hint = wrong.length === 1
      ? 'красное окошко'
      : 'красные окошки';

    setStatus(
      `Проверь ${hint}. ` +
      'Правильные цифры остаются на месте.',
      'error'
    );

    scene.classList.remove('shake');
    void scene.offsetWidth;
    scene.classList.add('shake');

    render();
    return;
  }

  // Верный код — открываем сундук.
  phase = 'opening';

  scene.classList.remove('shake');
  scene.classList.add('opened');

  $('new-game').disabled = true;

  $('speech').textContent =
    `Ура! ${gifts[level].name}!`;

  setStatus(
    'Сундук открыт! Внутри — ' +
    `${gifts[level].name.toLowerCase()}.`,
    'success'
  );

  render();

  // Герой подходит к сундуку.
  later(() => {
    scene.classList.add('approaching');
  }, 1000);

  // Забирает текущий подарок.
  later(() => {
    scene.classList.add('carrying');

    $('speech').textContent =
      'Забираю подарок в коллекцию!';
  }, 2350);

  // Возвращается с подарком.
  later(() => {
    scene.classList.add('returning');
  }, 2900);

  later(finishLevel, 4200);
}

// Завершение уровня.
function finishLevel() {
  phase = 'won';

  scene.classList.add('victory');

  const final = level === gifts.length - 1;

  $('speech').textContent = final
    ? 'Все пять подарков найдены! Спасибо!'
    : 'Подарок наш! Идём дальше?';

  setStatus(
    final
      ? 'Победа! Все 5 уровней пройдены. ' +
        'Посмотри на нашу коллекцию подарков!'
      : `Уровень ${level + 1} пройден! ` +
        `Найден подарок: ${gifts[level].name.toLowerCase()}.`,
    'success'
  );

  $('new-game').disabled = false;

  $('new-game').textContent = final
    ? 'Пройти ещё раз ↻'
    : 'Начать заново ↻';

  document.querySelector('.badge').textContent =
    `Найдено подарков: ${level + 1} из ${gifts.length}`;

  renderCollection();
  render();

  // Праздничное конфетти.
  const colors = [
    '#edb848',
    '#e78975',
    '#65b5ac',
    '#fff1bd'
  ];

  for (let i = 0; i < 35; i++) {
    const particle = document.createElement('i');

    particle.style.setProperty(
      '--x',
      `${randomInt(5, 95)}%`
    );

    particle.style.setProperty(
      '--delay',
      `${Math.random() * .8}s`
    );

    particle.style.setProperty(
      '--color',
      colors[i % colors.length]
    );

    $('confetti').append(particle);
  }

  later(() => {
    $('confetti').replaceChildren();
  }, 4000);
}

// Главная кнопка:
// проверка → следующий уровень → повтор всей игры.
function primaryAction() {
  if (phase === 'playing') {
    checkCode();
    return;
  }

  if (phase !== 'won') return;

  if (level === gifts.length - 1) {
    restartGame();
    return;
  }

  level++;
  startLevel();
}

// Экранная клавиатура.
for (
  const value of [
    1, 2, 3,
    4, 5, 6,
    7, 8, 9,
    0, 'delete'
  ]
) {
  const key = document.createElement('button');

  key.type = 'button';

  key.className =
    'key' +
    (value === 0
      ? ' zero'
      : value === 'delete'
        ? ' delete'
        : '');

  key.textContent = value === 'delete'
    ? '⌫'
    : value;

  key.setAttribute(
    'aria-label',
    value === 'delete'
      ? 'Стереть выбранную цифру'
      : `Ввести ${value}`
  );

  key.addEventListener('click', () => {
    if (value === 'delete') {
      eraseDigit();
    } else {
      enterDigit(value);
    }
  });

  keypad.append(key);
}

$('check').addEventListener('click', primaryAction);
$('new-game').addEventListener('click', restartGame);

// Обычная клавиатура.
document.addEventListener('keydown', event => {
  if (
    event.ctrlKey ||
    event.metaKey ||
    event.altKey
  ) {
    return;
  }

  if (
    event.key === 'Enter' &&
    event.target.tagName !== 'BUTTON' &&
    event.target.tagName !== 'SUMMARY'
  ) {
    event.preventDefault();
    primaryAction();
    return;
  }

  if (phase !== 'playing') return;

  if (/^[0-9]$/.test(event.key)) {
    event.preventDefault();
    enterDigit(Number(event.key));
  } else if (
    event.key === 'Backspace' ||
    event.key === 'Delete'
  ) {
    event.preventDefault();
    eraseDigit();
  } else if (
    event.key === 'ArrowLeft' ||
    event.key === 'ArrowRight'
  ) {
    event.preventDefault();

    const step = event.key === 'ArrowRight'
      ? 1
      : 4;

    select((selected + step) % 5);
  }
});

// Начинаем с первого уровня.
restartGame();
</script>
